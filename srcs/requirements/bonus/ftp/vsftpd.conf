listen=YES
listen_ipv6=NO

# Auth
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES

# TLS
ssl_enable=NO
rsa_cert_file=/etc/ssl/nginx/mlamrani.42.fr.crt
rsa_private_key_file=/etc/ssl/nginx/mlamrani.42.fr.key
force_local_data_ssl=YES
force_local_logins_ssl=YES

# Passive mode
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=localhost

# Logs
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
